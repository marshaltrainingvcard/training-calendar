<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marshal Training Calendar</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <div class="top-controls">
            <input type="text" id="searchBar" placeholder="Search courses...">

            <select id="monthFilter">
                <option value="">All Months</option>
            </select>

            <select id="locationFilter">
                <option value="">All Locations</option>
            </select>

            <select id="categoryFilter">
                <option value="">All Categories</option>
            </select>
        </div>

        <div id="calendar"></div>
        <div id="pagination"></div>

    </div>

    <!-- Modal -->
    <div id="courseModal" class="modal">
        <div class="modal-content">

            <span id="closeModal" class="close-btn">&times;</span>

            <h2 class="modal-title">
                <a id="modalTitleLink" href="#" target="_blank">
                    <span id="modalTitle"></span>
                </a>
            </h2>

            <div class="modal-section">
                <p><strong>Date:</strong> <span id="modalDate"></span></p>
                <p><strong>Location:</strong> <span id="modalLocation"></span></p>
                <p><strong>Fees:</strong> <span id="modalFees"></span></p>
            </div>

            <hr>

            <!-- FULL PROFESSIONAL STATICFORMS REGISTRATION FORM -->
            <form action="https://api.staticforms.dev/submit" method="POST" class="registration-form">

                <!-- StaticForms API Key -->
                <input type="hidden" name="apiKey" value="sf_576cac9853df30e63f036a37">

                <!-- Hidden course details -->
                <input type="hidden" name="course" id="formCourse">
                <input type="hidden" name="date" id="formDate">
                <input type="hidden" name="location" id="formLocation">
                <input type="hidden" name="fees" id="formFees">

                <h3>Course Registration</h3>
                <p>Please fill in your details below.</p>

                <h4>Personal Information</h4>

                <label>Full Name
                    <input type="text" name="full_name" required>
                </label>

                <label>Email
                    <input type="email" name="email" required>
                </label>

                <label>Company Name
                    <input type="text" name="company">
                </label>

                <label>Designation / Position
                    <input type="text" name="position">
                </label>

                <label>Country
                    <input type="text" name="country">
                </label>

                <label>Telephone Number
                    <input type="text" name="phone">
                </label>

                <h4>Billing / Administrator Information</h4>

                <label>Billing Name
                    <input type="text" name="billing_name">
                </label>

                <label>Billing Email
                    <input type="email" name="billing_email">
                </label>

                <label>Billing Company
                    <input type="text" name="billing_company">
                </label>

                <label>Billing Address
                    <textarea name="billing_address"></textarea>
                </label>

                <label>Billing Country
                    <input type="text" name="billing_country">
                </label>

                <label>Billing Telephone
                    <input type="text" name="billing_phone">
                </label>

                <label class="terms">
                    <input type="checkbox" name="terms" required>
                    I agree to the Terms & Conditions and Cancellation Policy.
                </label>

                <button type="submit" class="submit-btn">Submit Registration</button>

            </form>

        </div>
    </div>

    <!-- Success Overlay -->
    <div id="successOverlay">
        Your registration has been submitted successfully. We will send a confirmation shortly.
    </div>

    <script src="script.js"></script>
</body>
</html>
