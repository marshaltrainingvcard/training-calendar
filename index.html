<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marshal Training Calendar</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <div class="top-controls">
            <input type="text" id="searchBar" placeholder="Search courses...">

            <select id="monthFilter">
                <option value="">All Months</option>
            </select>

            <select id="locationFilter">
                <option value="">All Locations</option>
            </select>

            <select id="categoryFilter">
                <option value="">All Categories</option>
            </select>
        </div>

        <div id="calendar"></div>
        <div id="pagination"></div>

    </div>

    <!-- Modal -->
    <div id="courseModal" class="modal">
        <div class="modal-content">

            <span id="closeModal" class="close-btn">&times;</span>

            <h2 class="modal-title">
                <a id="modalTitleLink" href="#" target="_blank">
                    <span id="modalTitle"></span>
                </a>
            </h2>

            <div class="modal-section">
                <p><strong>Date:</strong> <span id="modalDate"></span></p>
                <p><strong>Location:</strong> <span id="modalLocation"></span></p>
                <p><strong>Fees:</strong> <span id="modalFees"></span></p>
            </div>

            <hr>

            <!-- WordPress Registration Form (via iframe) -->
            <iframe 
                id="registrationFormFrame"
                src=""
                style="width:100%; height:700px; border:none;">
            </iframe>

        </div>
    </div>

    <!-- Success Overlay -->
    <div id="successOverlay">
        Your registration has been submitted successfully. We will send a confirmation shortly.
    </div>

    <script src="script.js"></script>
</body>
</html>
