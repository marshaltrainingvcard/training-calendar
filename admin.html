<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marshal Training Admin Panel</title>

    <link rel="stylesheet" href="admin.css">

    <!-- MD5 hashing library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
</head>
<body>

<!-- LOGIN SCREEN -->
<div id="loginScreen" class="login-screen">
    <div class="login-box">
        <h2>Admin Login</h2>

        <label>Username</label>
        <input type="text" id="adminUser">

        <label>Password</label>
        <input type="password" id="adminPass">

        <button class="btn" onclick="adminLogin()">Login</button>

        <div id="loginError" class="error-msg">Invalid username or password</div>
    </div>
</div>

<!-- ADMIN PANEL -->
<div id="adminPanel" style="display:none;">
<div class="container">

    <h2>Admin Panel — Course Management</h2>

    <h3>Add New Course</h3>

    <form id="addCourseForm" class="box">

        <label>Course Title*</label>
        <input type="text" id="course_title" required>

        <label>Start Date*</label>
        <input type="date" id="start_date" required>

        <label>End Date*</label>
        <input type="date" id="end_date" required>

        <label>Location*</label>
        <input type="text" id="location" required>

        <label>Fees*</label>
        <input type="number" id="fees" required>

        <label>Currency*</label>
        <input type="text" id="currency" value="AED" required>

        <label>Category*</label>
        <input type="text" id="category" required>

        <label>Course Link (optional)</label>
        <input type="text" id="course_link">

        <button type="submit" class="btn">Add Course</button>
    </form>

    <div id="addSuccess" class="success">Course added successfully!</div>

    <hr>

    <h3>Existing Courses</h3>

    <div class="filter-bar">
        <input type="text" id="searchInput" placeholder="Search courses..." onkeyup="applyFilter()">

        <select id="filterCategory" onchange="applyFilter()">
            <option value="">All Categories</option>
        </select>

        <select id="filterLocation" onchange="applyFilter()">
            <option value="">All Locations</option>
        </select>
    </div>

    <table id="courseTable">
        <thead>
            <tr>
                <th>Course Title</th>
                <th>Start</th>
                <th>End</th>
                <th>Location</th>
                <th>Fees</th>
                <th>Category</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>

    <div id="pagination"></div>

</div>

<!-- EDIT MODAL -->
<div id="editModal" class="modal">
    <div class="modal-content">

        <h3>Edit Course</h3>

        <label>Course Title</label>
        <input id="edit_course_title">

        <label>Start Date</label>
        <input id="edit_start_date" type="date">

        <label>End Date</label>
        <input id="edit_end_date" type="date">

        <label>Location</label>
        <input id="edit_location">

        <label>Fees</label>
        <input id="edit_fees">

        <label>Currency</label>
        <input id="edit_currency">

        <label>Category</label>
        <input id="edit_category">

        <label>Course Link</label>
        <input id="edit_course_link">

        <button onclick="saveEdit()" class="btn">Save Changes</button>
        <button onclick="closeEdit()" class="btn cancel">Cancel</button>

    </div>
</div>

</div>

<script src="admin.js"></script>

</body>
</html>
